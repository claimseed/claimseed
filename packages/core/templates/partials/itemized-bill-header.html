<div class="hospital-header">
  <div class="hospital-header-bar">
    <div class="hospital-name-block">
      <div class="hospital-name">{{ metadata.hospitalName }} <span class="specimen-badge">SPECIMEN</span></div>
      <div class="hospital-address">{{ metadata.hospitalAddress }} &bull; {{ metadata.hospitalCityStateZip }}</div>
    </div>
    <div class="hospital-contact-block">
      <div>Phone: {{ metadata.hospitalPhone }}</div>
      <div>Billing: {{ metadata.billingPhone }}</div>
      <div>Tax ID: {{ metadata.taxId }}</div>
    </div>
  </div>
</div>
