name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # a newer run of the same event on the same branch cancels the one before it (a schedule never cancels a push); a
  # tag's run is never cancelled
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Actions pinned to commit SHAs (tag in the comment); bump deliberately, together with tests.yml and release.yml.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check                     # every workspace's check: brands/identifiers/binaries (check-synthetic), NPI prefixes, stock-text provenance (verify-stock-sources)
      - run: node packages/core/scripts/check-release-ready.js
        if: startsWith(github.ref, 'refs/tags/v')   # required on release tags; informational elsewhere
      - run: node packages/core/scripts/check-release-ready.js || true
        if: "!startsWith(github.ref, 'refs/tags/v')"
  tests:
    # the test shards and the rendered parts (tests.yml), as release.yml runs them
    uses: ./.github/workflows/tests.yml
  docker:
    # the MCP server image: build it and drive it over stdio, without network, as the README tells users to run it
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: docker build -t claimseed-mcp .
      - run: |
          mkdir -p out
          node packages/mcp/scripts/smoke.js --host-dir out --container-dir /work -- \
            docker run -i --rm --network none --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" -v "$PWD/out:/work" claimseed-mcp
  ci-ok:
    # one status for branch protection, however many shards and parts there are: it fails unless every job above
    # succeeded (a skipped or cancelled one included)
    needs: [checks, tests, docker]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          for r in "$CHECKS" "$TESTS" "$DOCKER"; do [ "$r" = success ] || { echo "a required job ended: $r"; exit 1; }; done
        env:
          CHECKS: ${{ needs.checks.result }}
          TESTS: ${{ needs.tests.result }}
          DOCKER: ${{ needs.docker.result }}
  nppes-monthly:
    # monthly, and on demand (Actions > ci > Run workflow) after a lexicon change
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30   # it waits on a public registry
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with: { node-version: 22 }
      - run: node packages/core/scripts/verify-synthetic-npi.js --nppes
